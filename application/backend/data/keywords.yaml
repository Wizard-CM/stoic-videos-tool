# Which nouns a color word can describe, and which param it sets.
color_targets:
  - {nouns: [hair], palette: hair, param: hair_color}
  - {nouns: [eyes, eye], palette: eyes, param: iris_color}
  - {nouns: [brows, eyebrows, eyebrow, brow], palette: hair, param: brow_color}
  - {nouns: [suit], palette: clothing, param: outfit_color, also: {outfit: suit, tie: true}}
  - {nouns: [blazer, jacket], palette: clothing, param: outfit_color, also: {outfit: blazer}}
  - {nouns: [hoodie], palette: clothing, param: outfit_color, also: {outfit: hoodie, tie: false}}
  - {nouns: [t-shirt, tshirt, tee], palette: clothing, param: outfit_color, also: {outfit: tshirt, tie: false}}
  - {nouns: [sweater, jumper, cardigan], palette: clothing, param: outfit_color, also: {outfit: sweater, tie: false}}
  - {nouns: [shirt, blouse], palette: clothing, param: shirt_color}
  - {nouns: [tie, necktie], palette: clothing, param: tie_color, also: {tie: true}}

# Words that never count as "not understood".
stopwords: [a, an, the, and, with, wearing, wears, has, have, in, of, very, quite, bit, slightly, kind, looking, who, is, look, looks, some, his, her, their, tall, short, nice, friendly, guy]
