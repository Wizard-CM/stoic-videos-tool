# Keyword auto-fill: plain phrase matching from a character description to builder params.
# No AI. Add new words by adding entries here.
#
# phrases: each entry matches any of its `words` (words must appear in order inside one
#          comma-separated part of the description; one extra word in between is allowed).
#   set:            params to set (dotted keys like background.generator are allowed)
#   set_by_gender:  params that depend on the character's gender
#   label:          what the UI shows under "Applied" (defaults to the matched phrase)
#   first: true     applied before everything else (gender and age decide later choices)

phrases:
  # --- gender and age (applied first) ---
  - {words: [man, guy, male, gentleman, he, him, dad, father, husband, sir, mr], set: {gender: male}, label: Male, first: true}
  - {words: [woman, lady, female, she, her, mom, mother, wife, madam, mrs, ms], set: {gender: female}, label: Female, first: true}
  - {words: [boy], set: {gender: male, age: child}, label: "Male, child", first: true}
  - {words: [girl], set: {gender: female, age: young}, label: "Female, young", first: true}
  - {words: [child, kid, little], set: {age: child, wrinkles: 0.0}, label: Child, first: true}
  - {words: [teen, teenager, young, youthful, student], set: {age: young, wrinkles: 0.0}, label: Young, first: true}
  - {words: [adult], set: {age: adult}, label: Adult, first: true}
  - {words: [middle-aged, middle aged, forties, fifties], set: {age: middle, wrinkles: 0.35}, label: Middle-aged, first: true}
  - {words: [old, older, elderly, senior, aged, grandpa, grandfather, grandma, grandmother], set: {age: elderly, wrinkles: 0.65}, label: Elderly, first: true}

  # --- hair ---
  - {words: [bald, balding], set: {hair_style: balding, hair_volume: 0.25}, set_by_gender: {female: {hair_style: pixie, hair_length: 0.1}}, label: Bald}
  - {words: [long hair], set: {hair_length: 0.85}, set_by_gender: {female: {hair_style: long_straight}, male: {hair_style: swept_back}}}
  - {words: [short hair], set: {hair_length: 0.25}, set_by_gender: {female: {hair_style: bob}, male: {hair_style: short_crop}}}
  - {words: [curly, curls, afro], set_by_gender: {female: {hair_style: curly_long}, male: {hair_style: curly_top}}, label: Curly hair}
  - {words: [ponytail], set: {gender: female, hair_style: ponytail}}
  - {words: [bun], set: {gender: female, hair_style: bun}, label: Hair bun}
  - {words: [bob], set: {gender: female, hair_style: bob}}
  - {words: [pixie], set: {gender: female, hair_style: pixie}, label: Pixie cut}
  - {words: [side part], set_by_gender: {male: {hair_style: side_part}, female: {hair_style: long_straight}}}
  - {words: [swept back, slicked back, combed back], set_by_gender: {male: {hair_style: swept_back}, female: {hair_style: bun}}, label: Swept back}
  - {words: [buzz cut, crew cut, shaved], set_by_gender: {male: {hair_style: buzz_cut}, female: {hair_style: pixie}}, label: Buzz cut}
  - {words: [messy, scruffy, wild hair], set: {hair_volume: 0.85}, label: Messy hair}
  - {words: [big hair, voluminous, thick hair], set: {hair_volume: 0.9}, label: Big hair}
  - {words: [highlights, streaks], set: {hair_highlight: 0.8}, label: Highlights}

  # --- facial hair ---
  - {words: [full beard, long beard, big beard, beard], set: {facial_hair: full_beard}, label: Beard}
  - {words: [short beard, trimmed beard], set: {facial_hair: short_beard}, label: Short beard}
  - {words: [goatee], set: {facial_hair: goatee}, label: Goatee}
  - {words: [mustache, moustache], set: {facial_hair: mustache}, label: Mustache}
  - {words: [stubble, unshaven], set: {facial_hair: stubble}, label: Stubble}
  - {words: [clean shaven, clean-shaven], set: {facial_hair: none}, label: Clean shaven}

  # --- glasses and extras ---
  - {words: [round glasses], set: {glasses: round}, label: Round glasses}
  - {words: [square glasses, rectangular glasses, thick glasses, glasses, spectacles], set: {glasses: rectangle}, label: Glasses}
  - {words: [no glasses], set: {glasses: none}, label: No glasses}
  - {words: [earrings, earring], set: {earrings: true}, label: Earrings}

  # --- outfits ---
  - {words: [suit], set: {outfit: suit, tie: true}, label: Suit}
  - {words: [blazer, jacket, sport coat], set: {outfit: blazer}, label: Blazer}
  - {words: [hoodie, hooded], set: {outfit: hoodie, tie: false}, label: Hoodie}
  - {words: [t-shirt, tshirt, tee], set: {outfit: tshirt, tie: false}, label: T-shirt}
  - {words: [sweater, jumper, cardigan, pullover], set: {outfit: sweater, tie: false}, label: Sweater}
  - {words: [tie, necktie], set: {tie: true}, label: Tie}
  - {words: [no tie], set: {tie: false}, label: No tie}

  # --- face ---
  - {words: [round face], set: {face_shape: round, head_width: 0.7}}
  - {words: [square jaw, strong jaw, square face], set: {face_shape: square, jaw_width: 0.85}, label: Square jaw}
  - {words: [long face], set: {face_shape: long, chin_length: 0.7}}
  - {words: [heart-shaped face, heart face], set: {face_shape: heart}, label: Heart-shaped face}
  - {words: [thin, skinny, narrow face, slim], set: {head_width: 0.25, neck_width: 0.3}, label: Thin face}
  - {words: [chubby, plump, fat, round cheeks], set: {head_width: 0.85, jaw_width: 0.7, neck_width: 0.75}, label: Full face}
  - {words: [pointy chin, pointed chin, long chin], set: {chin_length: 0.85}, label: Long chin}
  - {words: [big eyes, large eyes], set: {eye_size: 0.82}, label: Big eyes}
  - {words: [small eyes], set: {eye_size: 0.22}, label: Small eyes}
  - {words: [big nose, long nose], set: {nose_length: 0.82}, label: Long nose}
  - {words: [small nose, tiny nose], set: {nose_length: 0.22, nose_width: 0.3}, label: Small nose}
  - {words: [wide nose, broad nose], set: {nose_width: 0.85}, label: Wide nose}
  - {words: [wide mouth, big mouth], set: {mouth_width: 0.82}, label: Wide mouth}
  - {words: [small mouth], set: {mouth_width: 0.22}, label: Small mouth}
  - {words: [freckles, freckled], set: {freckles: 0.7}, label: Freckles}
  - {words: [mole, beauty mark], set: {moles: 0.6}, label: Mole}
  - {words: [blush, rosy cheeks, rosy], set: {blush: 0.6}, label: Rosy cheeks}
  - {words: [wrinkles, wrinkled, wrinkly], set: {wrinkles: 0.75}, label: Wrinkles}
  - {words: [thick brows, thick eyebrows, bushy brows, bushy eyebrows, heavy brows], set: {brow_thickness: 0.85}, label: Thick brows}
  - {words: [thin brows, thin eyebrows], set: {brow_thickness: 0.2}, label: Thin brows}
  - {words: [arched brows, arched eyebrows], set: {brow_arch: 0.85}, label: Arched brows}
  - {words: [long lashes, long eyelashes], set: {lash_style: bold}, label: Long lashes}
  - {words: [almond eyes], set: {eye_shape: almond}}
  - {words: [round eyes], set: {eye_shape: round}}
  - {words: [narrow eyes], set: {eye_shape: narrow}}
  - {words: [droopy eyes, sleepy eyes, tired eyes], set: {eye_shape: droopy}, label: Droopy eyes}
  - {words: [broad shoulders, muscular, strong], set: {shoulder_width: 0.85, neck_width: 0.7}, label: Broad shoulders}
  - {words: [narrow shoulders, small frame], set: {shoulder_width: 0.25}, label: Narrow shoulders}
  - {words: [thick neck], set: {neck_width: 0.85}, label: Thick neck}

  # --- skin tones ---
  - {words: [pale, pale skin, fair skin, fair], set: {skin_tone: "#F3D3BD"}, label: Fair skin}
  - {words: [light skin], set: {skin_tone: "#EBC3A3"}, label: Light skin}
  - {words: [tan, tanned, olive skin, olive], set: {skin_tone: "#C99468"}, label: Tan skin}
  - {words: [brown skin], set: {skin_tone: "#A06A45"}, label: Brown skin}
  - {words: [dark skin, dark-skinned], set: {skin_tone: "#6E4530"}, label: Dark skin}

  # --- backgrounds ---
  - {words: [office, newsroom, workplace], set: {background.generator: office}, label: Office background}
  - {words: [city, night city, downtown, skyline], set: {background.generator: night_city}, label: Night city background}

