# The 12 emotions a script tag can name. How each one LOOKS is drawn per character by Claude (the kit's
# "expressions", docs/PUPPET_KIT.md); this file only says how each one SOUNDS.
# delivery: how the voice changes at intensity 1.0 (speed factor, pitch in semitones, volume in dB).

default_intensity: 0.7

emotions:
  neutral:
    label: Neutral
    delivery: {speed: 1.0, pitch: 0.0, volume: 0.0}

  happy:
    label: Happy
    delivery: {speed: 1.05, pitch: 0.8, volume: 1.0}

  excited:
    label: Excited
    delivery: {speed: 1.12, pitch: 1.6, volume: 2.5}

  sad:
    label: Sad
    delivery: {speed: 0.88, pitch: -0.8, volume: -3.0}

  angry:
    label: Angry
    delivery: {speed: 1.08, pitch: 0.3, volume: 3.0}

  furious:
    label: Furious
    delivery: {speed: 1.12, pitch: 0.6, volume: 4.5}

  surprised:
    label: Surprised
    delivery: {speed: 1.05, pitch: 1.2, volume: 1.5}

  shocked:
    label: Shocked
    delivery: {speed: 1.0, pitch: 1.5, volume: 2.0}

  scared:
    label: Scared
    delivery: {speed: 1.1, pitch: 1.0, volume: -1.0}

  smug:
    label: Smug
    delivery: {speed: 0.95, pitch: -0.4, volume: 0.0}

  confused:
    label: Confused
    delivery: {speed: 0.97, pitch: 0.4, volume: -0.5}

  thinking:
    label: Thinking
    delivery: {speed: 0.9, pitch: -0.3, volume: -1.5}

# Other words people write in tags, mapped to an emotion.
aliases:
  calm: neutral
  serious: neutral
  flat: neutral
  glad: happy
  joyful: happy
  cheerful: happy
  pleased: happy
  thrilled: excited
  eager: excited
  upset: sad
  unhappy: sad
  depressed: sad
  hurt: sad
  annoyed: angry
  irritated: angry
  mad: angry
  frustrated: angry
  enraged: furious
  rage: furious
  livid: furious
  amazed: surprised
  astonished: surprised
  horrified: shocked
  stunned: shocked
  afraid: scared
  fearful: scared
  nervous: scared
  worried: scared
  arrogant: smug
  cocky: smug
  puzzled: confused
  unsure: confused
  pensive: thinking
  curious: thinking
