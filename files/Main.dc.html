<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ToonForge projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2D55E0}a:hover{color:#1F3FB0}
</style>
</helmet>
<div style="min-height: 900px; background: #F5F5F2; color: #1B1C20; font-family: 'Instrument Sans', 'Segoe UI', sans-serif; display: flex; flex-wrap: wrap">
  <nav aria-label="Main" style="flex: 1 1 200px; max-width: 240px; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #E2E2DC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px 24px">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="3" width="24" height="18" rx="6" fill="#2D55E0"></rect><path d="M8 20 L7 26 L14 20 Z" fill="#2D55E0"></path><circle cx="10" cy="12" r="2" fill="#FFFFFF"></circle><circle cx="18" cy="12" r="2" fill="#FFFFFF"></circle></svg>
      <span style="font-size: 18px; font-weight: 600">ToonForge</span>
    </div>
    <a href="Main.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #E8EDFC; color: #1F3FB0; font-weight: 600; font-size: 15px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9.5 L10 14.5 L14 12 Z"></path></svg>Projects</a>
    <a href="Cast.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #3A3D45; font-size: 15px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20 C5.5 16 8.5 14 12 14 C15.5 14 18.5 16 20 20"></path></svg>Characters</a>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #3A3D45; font-size: 15px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6 L13 6 M19 6 L20 6 M4 12 L7 12 M13 12 L20 12 M4 18 L15 18"></path><circle cx="16" cy="6" r="2.5"></circle><circle cx="10" cy="12" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle></svg>Settings</a>
    <p style="margin: auto 12px 0; padding-top: 24px; font-size: 13px; color: #5E616B">Runs fully offline on this PC.</p>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px">
    <div style="max-width: 1040px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.01em">Projects</h1>
          <p style="margin: 0; font-size: 15px; color: #5E616B">Paste a tagged script, pick your cast, and render.</p>
        </div>
        <a href="Script.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; background: #2D55E0; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5 L12 19 M5 12 L19 12"></path></svg>New video</a>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <label for="search" style="font-size: 14px; color: #3A3D45">Search</label>
        <input id="search" type="search" placeholder="Project title" style="flex: 0 1 320px; min-height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D4D4CD; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1B1C20">
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px">
        <sc-for list="{{projects}}" as="p" hint-placeholder-count="5">
          <article style="background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
            <div style="aspect-ratio: 16 / 9; background: #DADAD4">
              <sc-if value="{{p.isJade}}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 160 90" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="90" fill="#2E5E52"></rect><rect x="114" y="14" width="28" height="34" rx="1" fill="#E9DCC0"></rect><circle cx="124" cy="26" r="6" fill="#D9643A"></circle><rect x="128" y="32" width="10" height="12" fill="#2C3E63"></rect><path d="M50 60 C48 26 62 10 80 10 C98 10 112 26 110 62 L100 66 L60 66 Z" fill="#1E1A22"></path><path d="M50 90 C50 74 64 66 80 66 C96 66 110 74 110 90 Z" fill="#33363D"></path><path d="M72 67 L80 80 L88 67 Z" fill="#2FA37A"></path><rect x="75" y="56" width="10" height="12" fill="#A06A45"></rect><ellipse cx="80" cy="40" rx="17" ry="21" fill="#B07850"></ellipse><path d="M63 38 C62 22 72 17 81 17 C92 17 99 24 97 36 C90 27 79 26 63 38 Z" fill="#1E1A22"></path><ellipse cx="73" cy="42" rx="4" ry="3.4" fill="#FFFFFF"></ellipse><ellipse cx="87" cy="42" rx="4" ry="3.4" fill="#FFFFFF"></ellipse><circle cx="73.6" cy="42.4" r="2" fill="#2E8B6A"></circle><circle cx="87.6" cy="42.4" r="2" fill="#2E8B6A"></circle><path d="M68 36 L77 38.5" stroke="#1E1A22" stroke-width="1.8" stroke-linecap="round"></path><path d="M92 36 L83 38.5" stroke="#1E1A22" stroke-width="1.8" stroke-linecap="round"></path><path d="M75 52 Q80 55 85 52" stroke="#5A2E25" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
              </sc-if>
              <sc-if value="{{p.isRon}}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 160 90" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="90" fill="#27304F"></rect><rect x="0" y="30" width="18" height="60" fill="#1A2139"></rect><rect x="22" y="18" width="16" height="72" fill="#1A2139"></rect><rect x="122" y="24" width="16" height="66" fill="#1A2139"></rect><rect x="142" y="36" width="18" height="54" fill="#1A2139"></rect><rect x="26" y="26" width="2" height="2" fill="#F2C76B"></rect><rect x="32" y="34" width="2" height="2" fill="#F2C76B"></rect><rect x="126" y="32" width="2" height="2" fill="#F2C76B"></rect><rect x="146" y="44" width="2" height="2" fill="#F2C76B"></rect><path d="M48 90 C48 73 63 65 80 65 C97 65 112 73 112 90 Z" fill="#22325E"></path><path d="M72 66 L80 80 L88 66 Z" fill="#FFFFFF"></path><path d="M78.5 70 L81.5 70 L82.5 86 L80 89 L77.5 86 Z" fill="#A3262A"></path><rect x="74" y="55" width="12" height="12" fill="#D19C78"></rect><ellipse cx="64" cy="43" rx="2.5" ry="4" fill="#D19C78"></ellipse><ellipse cx="96" cy="43" rx="2.5" ry="4" fill="#D19C78"></ellipse><ellipse cx="80" cy="40" rx="16" ry="20" fill="#E2B08C"></ellipse><path d="M63 40 C60 22 70 12 81 12 C93 12 101 21 97 40 C96 30 92 24 86 23 C80 26 70 25 66 30 C64 33 64 37 63 40 Z" fill="#D9DCE1"></path><path d="M72 30 Q80 28.5 88 30" stroke="#C9936E" stroke-width="0.8" fill="none"></path><path d="M67 34 Q73 31 77 34" stroke="#8C9099" stroke-width="2.6" fill="none" stroke-linecap="round"></path><path d="M83 35 Q88 33 93 34" stroke="#8C9099" stroke-width="2.6" fill="none" stroke-linecap="round"></path><ellipse cx="72.5" cy="40" rx="3.6" ry="2.6" fill="#FFFFFF"></ellipse><ellipse cx="87.5" cy="40" rx="3.6" ry="2.6" fill="#FFFFFF"></ellipse><circle cx="73" cy="40.4" r="1.6" fill="#3E6FA8"></circle><circle cx="88" cy="40.4" r="1.6" fill="#3E6FA8"></circle><path d="M68.6 38.6 Q72.5 37 76.4 38.6" stroke="#B9835F" stroke-width="1.4" fill="none"></path><path d="M83.6 38.6 Q87.5 37 91.4 38.6" stroke="#B9835F" stroke-width="1.4" fill="none"></path><path d="M80 41 L78 48 L81 48" stroke="#B9835F" stroke-width="1.2" fill="none" stroke-linecap="round"></path><path d="M74 53 Q80 55 86 51" stroke="#6E3B2C" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
              </sc-if>
            </div>
            <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <h2 style="margin: 0; font-size: 16px; font-weight: 600">{{p.title}}</h2>
                <span style="flex: none; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: {{p.chipBg}}; color: {{p.chipFg}}">{{p.status}}</span>
              </div>
              <p style="margin: 0; font-size: 13.5px; color: #5E616B">{{p.meta}}</p>
            </div>
          </article>
        </sc-for>
        <a href="Script.dc.html" style="min-height: 220px; border: 1.5px dashed #C9C9C1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #3A3D45; text-decoration: none; font-size: 15px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5 L12 19 M5 12 L19 12"></path></svg>
          <span style="font-weight: 600">Start a new video</span>
          <span style="font-size: 13.5px; color: #5E616B">Title, script, cast, render</span>
        </a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ready = { chipBg: '#E3F2E8', chipFg: '#1D6A40' };
    const draft = { chipBg: '#EEEEEA', chipFg: '#45484F' };
    const busy = { chipBg: '#E8EDFC', chipFg: '#1F3FB0' };
    return {
      projects: [
        { title: 'The Missing Report', status: 'Ready', meta: '2 min 14 s, 16:9, edited today', isJade: true, isRon: false, ...ready },
        { title: 'Office Promotion', status: 'Rendering 64%', meta: '4 min 52 s, 16:9, edited today', isJade: false, isRon: true, ...busy },
        { title: 'Coffee Machine Feud', status: 'Draft', meta: '1 min 08 s, 9:16, edited yesterday', isJade: true, isRon: false, ...draft },
        { title: 'Quarterly Review', status: 'Ready', meta: '58 s, 9:16, edited Oct 12', isJade: false, isRon: true, ...ready },
        { title: 'Late Again', status: 'Draft', meta: 'No voices yet, 16:9, edited Oct 9', isJade: true, isRon: false, ...draft }
      ]
    };
  }
}
</script>
</body>
</html>
